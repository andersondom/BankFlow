name: BankFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and automated tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BankFlow.slnx

      - name: Build solution
        run: dotnet build BankFlow.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test BankFlow.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=bankflow-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankflow-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
