services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: bankflow-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: bankflow-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1600:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    container_name: bankflow-jaeger
    restart: unless-stopped

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"


  api:
    build:
      context: .
      dockerfile: src/BankFlow.Api/Dockerfile

    container_name: bankflow-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__BankFlow: "Server=sqlserver,1433;Database=BankFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}

      OpenTelemetry__OtlpEndpoint: http://jaeger:4317

    ports:
      - "5064:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  worker:
    build:
      context: .
      dockerfile: src/BankFlow.Worker/Dockerfile

    container_name: bankflow-worker
    restart: unless-stopped

    environment:
      ConnectionStrings__BankFlowWorker: "Server=sqlserver,1433;Database=BankFlowWorker;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}

      OpenTelemetry__OtlpEndpoint: http://jaeger:4317

    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started


volumes:
  rabbitmq-data:
  sqlserver-data:
