services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: bankflow-rabbitmq
    hostname: bankflow-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: bankflow
      RABBITMQ_DEFAULT_PASS: bankflow
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq-data:
